            }

            .knife4j-body-content .ant-alert,
            .knife4j-body-content .ant-alert *,
            .knife4j-body-content .ant-result,
            .knife4j-body-content .ant-result *,
            .knife4j-body-content .ant-pro-card,
            .knife4j-body-content .ant-pro-card * {
                color: #0f1826 !important;
                text-shadow: none !important;
            }

            .knife4j-body-content .ant-alert a,
            .knife4j-body-content .ant-result a,
            .knife4j-body-content .ant-pro-card a {
                color: #0d5ea8 !important;
            }

            .knife4j-body-content .gptips,
            .knife4j-body-content .gptips *,
            .knife4j-body-content [class*="gptips"],
            .knife4j-body-content [class*="gptips"] * {
                color: #0f1826 !important;
                text-shadow: none !important;
            }

            .knife4j-body-content .gptips a,
            .knife4j-body-content [class*="gptips"] a {
                color: #0d5ea8 !important;
            }

            .ant-btn,
            .ant-btn-default,
            .ant-btn-dashed,
            .ant-btn-text,
            .ant-btn-link {
                border-color: rgba(255, 255, 255, 0.16) !important;
                box-shadow: none !important;
            }

            .ant-btn:hover,
            .ant-btn-default:hover,
            .ant-btn-dashed:hover,
            .ant-btn-text:hover,
            .ant-btn-link:hover {
                background: rgba(20, 33, 53, 0.28) !important;
                border-color: rgba(143, 220, 255, 0.28) !important;
                color: #ffffff !important;
            }

            .ant-tabs-card > .ant-tabs-nav .ant-tabs-tab-active,
            .ant-tabs-card > div > .ant-tabs-nav .ant-tabs-tab-active {
                background: rgba(24, 39, 63, 0.34) !important;
                border-color: rgba(143, 220, 255, 0.26) !important;
            }

            .ant-breadcrumb,
            .ant-breadcrumb a,
            .ant-breadcrumb-link,
            .ant-breadcrumb-separator,
            .ant-tabs-nav .ant-tabs-tab:not(.ant-tabs-tab-active) .ant-tabs-tab-btn,
            .ant-tabs-nav .ant-tabs-tab:not(.ant-tabs-tab-active) .ant-tabs-tab-btn * {
                color: #f2f7ff !important;
                text-shadow: none !important;
            }

            .ant-tabs.ant-tabs-card .ant-tabs-card-bar .ant-tabs-tab:not(.ant-tabs-tab-active),
            .ant-tabs.ant-tabs-card .ant-tabs-card-bar .ant-tabs-tab:not(.ant-tabs-tab-active) *,
            .knife4j-tab .ant-tabs-card-bar .ant-tabs-tab:not(.ant-tabs-tab-active),
            .knife4j-tab .ant-tabs-card-bar .ant-tabs-tab:not(.ant-tabs-tab-active) * {
                color: #f2f7ff !important;
                text-shadow: none !important;
            }

            .knife4j-body-content a {
                color: #8fdcff !important;
            }

            .ant-btn-primary,
            .ant-btn.ant-btn-primary {
                background: linear-gradient(135deg, #26b8ff, #22d39f) !important;
                border: 0 !important;
                color: #041018 !important;
                font-weight: 700;
                box-shadow: 0 10px 24px rgba(34, 211, 159, 0.22);
            }

            .ant-badge-count,
            .ant-tag-processing,
            .ant-tag-blue {
                background: linear-gradient(135deg, #1d84ff, #17c6ff) !important;
                border: 0 !important;
                color: white !important;
            }

            ::-webkit-scrollbar {
                width: 10px;
                height: 10px;
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(125, 151, 188, 0.34);
                border-radius: 999px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }
        `;

        doc.head.appendChild(style);
        doc.title = "Online Judge · API 控制台";

        const imageBackground = `linear-gradient(rgba(10, 18, 30, 0.18), rgba(10, 18, 30, 0.18)), url("${backgroundImageUrl}") center top / cover no-repeat fixed`;
        const transparentSelectors = [
            "html",
            "body",
            "#app",
            ".ant-layout",
            ".ant-layout-content",
            ".knife4j-body-content",
            "main.knife4j-body-content.ant-layout-content",
            ".knife4j-body-content > .ant-row",
            ".knife4j-body-content .ant-col.ant-col-24",
            ".knife4j-body-content .title",
            ".knife4j-body-content .description",
            ".knife4j-body-content .content-line"
        ];

        [doc.documentElement, doc.body, doc.querySelector("#app")].forEach((element) => {
            if (!element) {
                return;
            }
            element.style.setProperty("background", imageBackground, "important");
            element.style.setProperty("background-color", "transparent", "important");
        });

        transparentSelectors.forEach((selector) => {
            doc.querySelectorAll(selector).forEach((element) => {
                element.style.setProperty("background", "transparent", "important");
                element.style.setProperty("background-color", "transparent", "important");
            });
        });

        const triggerSvg = `
            <span class="oj-trigger-icon-wrap" aria-hidden="true">
                <svg class="oj-trigger-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="5" width="12" height="2.5" rx="1.25" fill="#EAF4FF"/>
                    <rect x="4" y="10.75" width="16" height="2.5" rx="1.25" fill="#98D8FF"/>
                    <rect x="8" y="16.5" width="12" height="2.5" rx="1.25" fill="#45E0B0"/>
                    <circle cx="18.5" cy="6.25" r="1.5" fill="#45E0B0"/>
                </svg>
            </span>
        `;

        const patchTriggerIcon = () => {
            const triggerSelectors = [
                ".ant-pro-global-header-trigger",
                ".ant-layout-sider-trigger",
                ".ant-pro-sider-collapsed-button",
                ".ant-pro-top-nav-header-trigger"
            ];

            triggerSelectors.forEach((selector) => {
                doc.querySelectorAll(selector).forEach((trigger) => {
                    if (trigger.querySelector(".oj-trigger-icon-wrap")) {
                        return;
                    }
                    trigger.querySelectorAll(".anticon, svg").forEach((icon) => {
                        icon.style.setProperty("display", "none", "important");
                    });
                    const wrapper = doc.createElement("span");
                    wrapper.innerHTML = triggerSvg.trim();
                    const iconNode = wrapper.firstElementChild;
                    if (iconNode) {
                        trigger.appendChild(iconNode);
                    }
                });
            });
        };

        const patchSearchIcon = () => {
            const scopes = [
                ".ant-layout-header",
                ".ant-pro-fixed-header",
                ".ant-pro-global-header",
                ".ant-pro-top-nav-header"
            ];

            scopes.forEach((scopeSelector) => {
                doc.querySelectorAll(scopeSelector).forEach((scope) => {
                    scope.querySelectorAll(".ant-input-suffix").forEach((suffix) => {
                        if (!suffix.querySelector(".anticon-search, .ant-input-search-icon")) {
                            return;
                        }
                        suffix.classList.add("oj-search-icon-host");
                        suffix.querySelectorAll(".anticon-search, .ant-input-search-icon, .anticon-search svg, .ant-input-search-icon svg").forEach((icon) => {
                            icon.style.setProperty("opacity", "0", "important");
                            icon.style.setProperty("visibility", "hidden", "important");
                            icon.style.setProperty("pointer-events", "none", "important");
                        });
                    });
                });
            });
        };

        const patchHeaderSearchField = () => {
            const scopes = [
                ".ant-layout-header",
                ".ant-pro-fixed-header",
                ".ant-pro-global-header",
                ".ant-pro-top-nav-header"
            ];

            scopes.forEach((scopeSelector) => {
                doc.querySelectorAll(scopeSelector).forEach((scope) => {
                    scope.querySelectorAll("input.ant-select-search__field").forEach((input) => {
                        const shell = input.closest(".headerSearch .input")
                            || input.closest(".ant-select-auto-complete.ant-select")
                            || input.closest(".ant-select")
                            || input.closest(".ant-select-selection--single")
                            || input.closest(".ant-select-search")
                            || input.parentElement;
                        if (!shell) {
                            return;
                        }
                        shell.classList.add("oj-header-search-shell");
                    });
                });
            });
        };

        const ensureSearchVeil = () => {
            let veil = doc.getElementById("oj-search-veil");
            if (!veil) {
                veil = doc.createElement("div");
                veil.id = "oj-search-veil";
                doc.body.appendChild(veil);
                veil.addEventListener("click", (event) => {
                    if (event.target !== veil) {
                        return;
                    }
                    deactivateSearchShell(true);
                });
            }
            return veil;
        };

        const syncSearchShellSize = (shell) => {
            shell.style.setProperty("width", "244px", "important");
            shell.style.setProperty("min-width", "244px", "important");
            shell.style.setProperty("flex", "0 0 244px", "important");
            shell.style.setProperty("margin-left", "8px", "important");
        };

        const deactivateSearchShell = (restoreFocus = false) => {
            if (!activeSearchShell) {
                return;
            }

            const shell = activeSearchShell;
            const placeholder = activeSearchPlaceholder;
            const veil = ensureSearchVeil();
            const shellInput = shell.querySelector("input.ant-select-search__field");

            if (shellInput && shell.contains(doc.activeElement)) {
                shellInput.blur();
            }

            clearTimeout(deactivateTimer);
            shell.classList.remove("oj-header-search-shell--active");
            veil.classList.remove("oj-search-veil--active");

            const done = () => {
                shell.classList.remove("oj-header-search-shell--floating");
                shell.style.removeProperty("--oj-search-start-left");
                shell.style.removeProperty("--oj-search-start-top");
                shell.style.removeProperty("--oj-search-start-width");
                shell.style.removeProperty("--oj-search-start-height");
                syncSearchShellSize(shell);
                if (activeSearchParent) {
                    activeSearchParent.insertBefore(shell, placeholder || activeSearchNextSibling);
                }
                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.removeChild(placeholder);
                }
                activeSearchShell = null;
                activeSearchPlaceholder = null;
                activeSearchParent = null;
                activeSearchNextSibling = null;
            };

            deactivateTimer = window.setTimeout(done, 430);
        };

        const activateSearchShell = (input) => {
            const shell = input.closest(".oj-header-search-shell");
            if (!shell) {
                return;
            }

            if (activeSearchShell === shell) {
                return;
            }

            if (activeSearchShell && activeSearchShell !== shell) {
                deactivateSearchShell(false);
            }

            syncSearchShellSize(shell);
            const rect = shell.getBoundingClientRect();
            const placeholder = doc.createElement("div");
            placeholder.className = "oj-header-search-placeholder";
            placeholder.style.width = `${Math.round(rect.width)}px`;
            placeholder.style.minWidth = `${Math.round(rect.width)}px`;
            placeholder.style.flex = `0 0 ${Math.round(rect.width)}px`;
            placeholder.style.height = `${Math.round(rect.height)}px`;

            activeSearchParent = shell.parentNode;
            activeSearchNextSibling = shell.nextSibling;
            shell.parentNode?.insertBefore(placeholder, shell);
            activeSearchShell = shell;
            activeSearchPlaceholder = placeholder;

            shell.style.setProperty("--oj-search-start-left", `${Math.round(rect.left)}px`);
            shell.style.setProperty("--oj-search-start-top", `${Math.round(rect.top)}px`);
            shell.style.setProperty("--oj-search-start-width", `${Math.round(rect.width)}px`);
            shell.style.setProperty("--oj-search-start-height", `${Math.round(rect.height)}px`);
            doc.body.appendChild(shell);
            shell.classList.add("oj-header-search-shell--floating");
            ensureSearchVeil().classList.add("oj-search-veil--active");

            window.requestAnimationFrame(() => {
                shell.classList.add("oj-header-search-shell--active");
                input.focus({preventScroll: true});
            });
        };

        const bindSearchFieldBehavior = () => {
            doc.querySelectorAll(".oj-header-search-shell").forEach((shell) => {
                if (shell.dataset.ojShellBound === "1") {
                    return;
                }
                shell.dataset.ojShellBound = "1";

                const swallowShellEvent = (event) => {
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                };

                shell.addEventListener("pointerdown", swallowShellEvent, true);
                shell.addEventListener("mousedown", swallowShellEvent, true);
                shell.addEventListener("click", swallowShellEvent, true);
            });

            doc.querySelectorAll(".oj-header-search-shell input.ant-select-search__field").forEach((input) => {
                if (input.dataset.ojSearchBound === "1") {
                    return;
                }
                input.dataset.ojSearchBound = "1";

                const swallowInputEvent = (event) => {
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                };

                input.addEventListener("pointerdown", swallowInputEvent, true);
                input.addEventListener("mousedown", swallowInputEvent, true);
                input.addEventListener("click", swallowInputEvent, true);

                input.addEventListener("focus", () => {
                    activateSearchShell(input);
                });

                const swallowKeyEvent = (event) => {
                    if (event.key === "Escape") {
                        return;
                    }
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                };

                input.addEventListener("keydown", swallowKeyEvent, true);
                input.addEventListener("keypress", swallowKeyEvent, true);
                input.addEventListener("keyup", swallowKeyEvent, true);

                input.addEventListener("keydown", (event) => {
                    if (event.key === "Escape") {
                        event.preventDefault();
                        event.stopPropagation();
                        event.stopImmediatePropagation();
                        deactivateSearchShell(false);
                    }
                }, true);
            });
        };

        patchTriggerIcon();
        patchSearchIcon();
        patchHeaderSearchField();
        bindSearchFieldBehavior();
        ensureSearchVeil();

        if (!doc.body.dataset.ojTriggerObserverBound) {
            const observer = new MutationObserver(() => {
                patchTriggerIcon();
                patchSearchIcon();
                patchHeaderSearchField();
                bindSearchFieldBehavior();
            });
            observer.observe(doc.body, {
                childList: true,
                subtree: true
            });
            doc.body.dataset.ojTriggerObserverBound = "1";
        }

    }

    iframe.addEventListener("load", () => {
        injectTheme();
        setTimeout(injectTheme, 600);
        setTimeout(injectTheme, 1500);
    });
</script>
</body>
</html>
